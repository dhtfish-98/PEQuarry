[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "PEQuarry"
version = "1.0.1"
description = "Bounded local PE inspection and static signature review; attributed pefile derivative"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["checks"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "build==1.6.1", "setuptools==84.0.0", "wheel==0.48.0", "libcst==1.9.0"]

[tool.setuptools.data-files]
"share/PEQuarry" = ["README.md", "ORIGIN.md", "VALIDATION.md", "DEFENSIVE_SCOPE.md", "NAME_AUDIT.json", "CURRENT_REVIEW.json"]
